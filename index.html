<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>trader-pro</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --text: #15181f;
    --text-dim: #6b7280;
    --border: #e6e8ec;
    --green: #16a34a;
    --red: #dc2626;
    --accent: #2563eb;
    --badge-bg: #eef1f6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1016;
      --card: #171a22;
      --text: #eef0f4;
      --text-dim: #8d94a3;
      --border: #272c38;
      --green: #22c55e;
      --red: #f87171;
      --accent: #60a5fa;
      --badge-bg: #1f2430;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 16px;
    padding-bottom: 48px;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 16px; }
  h1 { font-size: 17px; font-weight: 600; margin: 0; }
  .updated { font-size: 12px; color: var(--text-dim); }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 14px;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
  }
  .equity-row { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .equity-value { font-size: 32px; font-weight: 700; letter-spacing: -0.02em; }
  .equity-change { font-size: 15px; font-weight: 600; }
  .equity-sub { font-size: 13px; color: var(--text-dim); margin-top: 4px; }
  .pill {
    display: inline-block;
    font-size: 12px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--badge-bg);
  }
  .pill.open { color: var(--green); }
  .pill.closed { color: var(--text-dim); }
  svg.chart { width: 100%; height: 72px; display: block; margin-top: 10px; }
  h2 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-dim);
    margin: 0 0 10px;
    font-weight: 600;
  }
  .position-row, .op-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 9px 0;
    border-top: 1px solid var(--border);
  }
  .position-row:first-of-type, .op-row:first-of-type { border-top: none; }
  .row-name { font-weight: 600; font-size: 14px; }
  .row-sub { font-size: 12px; color: var(--text-dim); margin-top: 1px; }
  .row-value { text-align: right; font-size: 14px; font-weight: 600; }
  .pl.up { color: var(--green); }
  .pl.down { color: var(--red); }
  .op-reason { font-size: 12px; color: var(--text-dim); margin-top: 3px; max-width: 100%; }
  .badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 6px;
    margin-top: 4px;
  }
  .badge.submitted { background: color-mix(in srgb, var(--green) 18%, transparent); color: var(--green); }
  .badge.rejected { background: color-mix(in srgb, var(--red) 15%, transparent); color: var(--red); }
  .badge.skipped, .badge.failed { background: var(--badge-bg); color: var(--text-dim); }
  .empty { color: var(--text-dim); font-size: 13px; padding: 4px 0; }
  .text-block { font-size: 14px; line-height: 1.5; }
  .refresh-note { text-align: center; font-size: 11px; color: var(--text-dim); margin-top: 8px; }

  .alloc-bar { display: flex; width: 100%; height: 14px; border-radius: 7px; overflow: hidden; background: var(--badge-bg); }
  .alloc-bar span { height: 100%; }
  .alloc-legend { display: flex; flex-wrap: wrap; gap: 10px 16px; margin-top: 12px; }
  .alloc-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-dim); }
  .alloc-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; }
  .stat-label { font-size: 11px; color: var(--text-dim); }
  .stat-value { font-size: 15px; font-weight: 600; margin-top: 1px; }

  .error-banner {
    display: none;
    background: var(--badge-bg);
    color: var(--red);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 13px;
    margin-bottom: 14px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>🧠 trader-pro</h1>
      <span class="updated" id="updated">—</span>
    </header>

    <div class="error-banner" id="error-banner">Impossibile aggiornare i dati — mostro l'ultima versione disponibile.</div>

    <div class="card">
      <div class="equity-row">
        <div class="equity-value" id="equity">—</div>
        <div class="equity-change" id="equity-change"></div>
      </div>
      <div class="equity-sub" id="equity-sub">—</div>
      <svg class="chart" id="chart" viewBox="0 0 300 72" preserveAspectRatio="none"></svg>
    </div>

    <div class="card">
      <h2>Allocazione</h2>
      <div class="alloc-bar" id="alloc-bar"></div>
      <div class="alloc-legend" id="alloc-legend"></div>
    </div>

    <div class="card">
      <h2>Posizioni aperte</h2>
      <div id="positions"><div class="empty">Caricamento…</div></div>
    </div>

    <div class="card">
      <h2>Ultimo ciclo</h2>
      <div class="text-block" id="market-view">—</div>
      <div id="operations" style="margin-top: 10px;"></div>
    </div>

    <div class="card">
      <h2>Prossimo controllo</h2>
      <div class="text-block" id="plan-next">—</div>
    </div>

    <div class="card">
      <h2>Token usati (ultimo ciclo)</h2>
      <div class="stat-grid" id="tokens">—</div>
    </div>

    <div class="refresh-note">Si aggiorna da sola ogni 60 secondi</div>
  </div>

<script>
  const fmtMoney = (n) => (n ?? 0).toLocaleString("it-IT", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " $";
  const fmtPercent = (n) => {
    const sign = n >= 0 ? "+" : "";
    return sign + (n * 100).toLocaleString("it-IT", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + "%";
  };
  const fmtDate = (iso) => {
    try {
      return new Date(iso).toLocaleString("it-IT", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
    } catch { return iso; }
  };

  const VERDICT_LABEL = {
    submitted: "Eseguita",
    rejected: "Bloccata dalla gabbia",
    "skipped-market-closed": "Mercato chiuso",
    failed: "Invio fallito",
  };

  // Tavolozza fissa per i titoli in portafoglio, stabile tra un aggiornamento e l'altro
  // (non dipende dall'ordine in cui arrivano le posizioni).
  const PALETTE = ["#2563eb", "#f59e0b", "#8b5cf6", "#06b6d4", "#ec4899", "#84cc16", "#f97316", "#14b8a6"];
  function colorFor(symbol) {
    let hash = 0;
    for (let i = 0; i < symbol.length; i++) hash = (hash * 31 + symbol.charCodeAt(i)) >>> 0;
    return PALETTE[hash % PALETTE.length];
  }

  function renderChart(history) {
    const svg = document.getElementById("chart");
    if (!history || history.length === 0) { svg.innerHTML = ""; return; }
    if (history.length === 1) {
      // Un solo punto: nessuna linea disegnabile, mostra solo un pallino così non sembra rotto.
      svg.innerHTML = `<circle cx="150" cy="36" r="4" fill="var(--accent)"></circle>`;
      return;
    }
    const values = history.map((pt) => pt.equity);
    const min = Math.min(...values), max = Math.max(...values);
    const range = max - min || 1;
    const w = 300, h = 72, pad = 4;
    const coords = history.map((pt, i) => {
      const x = (i / (history.length - 1)) * (w - pad * 2) + pad;
      const y = h - pad - ((pt.equity - min) / range) * (h - pad * 2);
      return [x, y];
    });
    const up = values[values.length - 1] >= values[0];
    const color = up ? "var(--green)" : "var(--red)";
    const line = coords.map((c) => c.join(",")).join(" ");
    svg.innerHTML = `
      <polygon points="${coords[0][0]},${h} ${line} ${coords[coords.length - 1][0]},${h}" fill="${color}" opacity="0.12"></polygon>
      <polyline points="${line}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></polyline>
    `;
  }

  function renderAllocation(account, positions) {
    const bar = document.getElementById("alloc-bar");
    const legend = document.getElementById("alloc-legend");
    const equity = account.equity || 0;
    if (equity <= 0) { bar.innerHTML = ""; legend.innerHTML = ""; return; }

    const investedValue = positions.reduce((sum, p) => sum + p.marketValue, 0);
    const cashValue = Math.max(0, equity - investedValue);
    const segments = [
      ...positions.map((p) => ({ label: p.name, value: p.marketValue, color: colorFor(p.symbol) })),
      { label: "Liquidità", value: cashValue, color: "var(--text-dim)" },
    ].filter((s) => s.value > 0);

    bar.innerHTML = segments.map((s) => `<span style="width:${(s.value / equity) * 100}%; background:${s.color};"></span>`).join("");
    legend.innerHTML = segments
      .map((s) => `<div class="alloc-item"><span class="alloc-dot" style="background:${s.color};"></span>${s.label} · ${((s.value / equity) * 100).toFixed(1)}%</div>`)
      .join("");
  }

  function renderEquityChange(history) {
    const el = document.getElementById("equity-change");
    if (!history || history.length < 2) { el.textContent = ""; return; }
    const first = history[0].equity, last = history[history.length - 1].equity;
    if (!first) { el.textContent = ""; return; }
    const pct = (last - first) / first;
    el.className = "equity-change " + (pct >= 0 ? "pl up" : "pl down");
    el.textContent = fmtPercent(pct);
  }

  function renderPositions(positions) {
    const el = document.getElementById("positions");
    if (!positions || positions.length === 0) {
      el.innerHTML = '<div class="empty">Nessuna posizione aperta</div>';
      return;
    }
    el.innerHTML = positions.map((p) => `
      <div class="position-row">
        <div>
          <div class="row-name">${p.name}</div>
          <div class="row-sub">${p.qty} azioni</div>
        </div>
        <div>
          <div class="row-value">${fmtMoney(p.marketValue)}</div>
          <div class="row-value pl ${p.unrealizedPlPercent >= 0 ? "up" : "down"}">${fmtPercent(p.unrealizedPlPercent)}</div>
        </div>
      </div>
    `).join("");
  }

  function renderOperations(operations) {
    const el = document.getElementById("operations");
    if (!operations || operations.length === 0) {
      el.innerHTML = '<div class="empty">Nessuna operazione proposta in questo ciclo</div>';
      return;
    }
    el.innerHTML = operations.map((o) => `
      <div class="op-row" style="align-items:flex-start; flex-direction: column;">
        <div style="display:flex; justify-content: space-between; width: 100%;">
          <div class="row-name">${o.side === "buy" ? "Comprare" : "Vendere"} ${o.name}</div>
          <div class="row-value">${o.price != null ? fmtMoney(o.total) : ""}</div>
        </div>
        <div class="op-reason">${o.reason}</div>
        <span class="badge ${o.verdict}">${VERDICT_LABEL[o.verdict] ?? o.verdict}</span>
      </div>
    `).join("");
  }

  function renderTokenStats(tokens) {
    const el = document.getElementById("tokens");
    if (!tokens) { el.innerHTML = '<div class="empty">n/d</div>'; return; }
    const stats = [
      ["Totale", tokens.total.toLocaleString("it-IT")],
      ["Durata", `${(tokens.durationMs / 1000).toFixed(1)}s`],
      ["Nuovi in ingresso", tokens.input.toLocaleString("it-IT")],
      ["Generati", tokens.output.toLocaleString("it-IT")],
      ["Letti da cache", tokens.cacheRead.toLocaleString("it-IT")],
      ["Creati in cache", tokens.cacheCreation.toLocaleString("it-IT")],
    ];
    el.innerHTML = stats
      .map(([label, value]) => `<div><div class="stat-label">${label}</div><div class="stat-value">${value}</div></div>`)
      .join("");
  }

  async function load() {
    try {
      const bust = "?t=" + Date.now();
      const [latestRes, historyRes] = await Promise.all([
        fetch("latest.json" + bust, { cache: "no-store" }),
        fetch("history.json" + bust, { cache: "no-store" }),
      ]);
      if (!latestRes.ok) throw new Error("latest.json non raggiungibile");
      const latest = await latestRes.json();
      const history = historyRes.ok ? await historyRes.json() : [];

      document.getElementById("error-banner").style.display = "none";
      document.getElementById("updated").textContent = fmtDate(latest.updatedAtIso);
      document.getElementById("equity").textContent = fmtMoney(latest.account.equity);
      document.getElementById("equity-sub").innerHTML =
        `<span class="pill ${latest.marketOpen ? "open" : "closed"}">${latest.marketOpen ? "Mercato aperto" : "Mercato chiuso"}</span> ` +
        `&nbsp;${latest.slot ?? ""} <span style="opacity:0.7">(all'ultimo ciclo)</span>`;
      renderChart(history);
      renderEquityChange(history);
      renderAllocation(latest.account, latest.positions);
      renderPositions(latest.positions);
      document.getElementById("market-view").textContent = latest.marketView ?? "—";
      renderOperations(latest.operations);
      document.getElementById("plan-next").textContent = latest.planNext ?? "—";
      renderTokenStats(latest.tokens);
    } catch (err) {
      document.getElementById("error-banner").style.display = "block";
      console.error(err);
    }
  }

  load();
  setInterval(load, 60000);
</script>
</body>
</html>
